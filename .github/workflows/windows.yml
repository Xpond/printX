name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install pinned wheels
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Fetch pinned Ghostscript
        run: python scripts/ghostscript.py
      - name: Test core and GUI
        run: python -m pytest -q
      - name: Test native Windows source startup
        run: |
          python scripts/check_frozen.py app.py "$env:RUNNER_TEMP/source-smoke"
      - name: Build portable executable
        run: python scripts/build.py
      - name: Test executable outside checkout
        shell: pwsh
        run: |
          $appFolder = Join-Path $env:RUNNER_TEMP 'PrintShop portable'
          Copy-Item 'dist/PrintShop Tools' $appFolder -Recurse
          $report = Join-Path $env:RUNNER_TEMP 'smoke-results'
          python scripts/check_frozen.py "$appFolder/PrintShop Tools.exe" $report
      - name: Build installer
        run: python scripts/build_installer.py
      - name: Test installation, installed app, and uninstall
        run: python scripts/check_installer.py "$env:RUNNER_TEMP/installer-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: dist/installer/
          retention-days: 30
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-screenshots
          path: |
            ${{ runner.temp }}/smoke-results/
            ${{ runner.temp }}/installer-smoke/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-installer
          path: installer
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" installer/PrintShop-Tools-Setup.exe installer/SHA256SUMS.txt --verify-tag --title "PrintShop Tools $RELEASE_TAG" --notes-file RELEASE-NOTES.md
